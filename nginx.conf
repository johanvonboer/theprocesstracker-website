server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative (e.g. /license -> /license/) so they work behind any host/port
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Webpack output is content-hashed, so it can be cached indefinitely
    location ~* "\.[0-9a-f]{20}\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript;
}
